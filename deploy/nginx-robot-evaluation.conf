# Replace the server address and office subnet before enabling this file.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Keep the viewer inside the company network.
    allow 127.0.0.1;
    allow ::1;
    # Company clients currently span 192.168.10.x and 192.168.20.x.
    allow 192.168.0.0/16;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:8786;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 1k;
    }
}
